<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Bar with Dropdown Menu</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Fixed top navigation bar */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #333;
        padding: 10px;
        display: flex;
        justify-content: center;
        z-index: 1000;
    }

    /* Dropdown container */
    .dropdown {
        position: relative;
        display: inline-block;
    }

    /* Main button */
    .dropbtn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    .dropbtn:hover {
        background-color: #45a049;
    }

    /* Dropdown menu */
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
        z-index: 1;
        border-radius: 5px;
        overflow: hidden;
    }

    /* Dropdown links */
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }

    .dropdown-content a:hover {
        background-color: #ddd;
    }

    /* Show dropdown on hover */
    .dropdown:hover .dropdown-content {
        display: block;
    }

    /* Page content padding */
    .content {
        padding-top: 70px;
    }
</style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar">
    <div class="dropdown">
        <button class="dropbtn">Go to Page</button>
        <div class="dropdown-content">
            <a href="page1.html">Page 1</a>
            <a href="page2.html">Page 2</a>
            <a href="page3.html">Page 3</a>
        </div>
    </div>
</div>

<!-- Example content -->
<div class="content">
    <h1>Welcome</h1>
    <p>This is the main page. Use the dropdown menu above to navigate to other pages.</p>
</div>

</body>
</html>
