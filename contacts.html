<body>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Fixed top navigation bar */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #333;
        padding: 10px;
        display: flex;
        justify-content: center;
        z-index: 1000;
    }

    /* Dropdown container */
    .dropdown {
        position: relative;
        display: inline-block;
    }

    /* Main button */
    .dropbtn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    .dropbtn:hover {
        background-color: #45a049;
    }

    /* Dropdown menu */
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
        z-index: 1;
        border-radius: 5px;
        overflow: hidden;
    }

    /* Dropdown links */
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }

    .dropdown-content a:hover {
        background-color: #ddd;
    }

    /* Show dropdown on hover */
    .dropdown:hover .dropdown-content {
        display: block;
    }

    /* Page content padding */
    .content {
        padding-top: 70px;
    }
</style>
</head>
<h1><br><br>
    <div class="top-bar">
        <button onclick="window.location.href='home.html'">Home</button>
        <button onclick="window.location.href='speech_class.html'">Speech Class</button>
        <button onclick="window.location.href='projects_home.html'">Projects</button>
        <button onclick="window.location.href='testhome.html'">Test</button>
        <button onclick="window.location.href='contacts.html'">Contact</button>
    </div>
    <form id="contactForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send</button>
    </form>
    </h1>

    <div class="success" id="successMessage">Your message has been saved!</div>

    <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch("save_contact.php", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById("successMessage").style.display = "block";
                document.getElementById("contactForm").reset();
            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(err => alert("Request failed: " + err));
    });
    </script>
</body>
</html>
